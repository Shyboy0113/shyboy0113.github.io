name: 로또 당첨번호 갱신

on:
  schedule:
    - cron: "40 12 * * 6"   # 토 21:40 (한국 시간)
    - cron: "10 15 * * 6"   # 토 24:10 (한국 시간) 재시도
    - cron: "20 0 * * 0"    # 일 09:20 (한국 시간) 재시도
  workflow_dispatch:         # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: lotto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 당첨번호 받기
        run: node .github/scripts/update-lotto.mjs

      - name: 변경 사항 커밋
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- lotto6_korea/draws.json)" ]; then
            echo "변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto6_korea/draws.json
          git commit -m "로또 당첨번호 자동 갱신"
          git push
