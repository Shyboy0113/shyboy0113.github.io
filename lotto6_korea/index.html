<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로또 6/45 번호 분석기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#f6f5f8; --ink:#1d2029; --muted:#676c7a; --line:#e4e2e9;
  --slip:#c8102e; --slip-soft:#fbe8eb; --focus:#2b59c3;
  --b1:#fbc400; --b2:#69c8f2; --b3:#ff7272; --b4:#aaaaaa; --b5:#b0d840; --ballink:#ffffff;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161b; --surface:#1d2027; --ink:#eceef3; --muted:#a2a7b5; --line:#2e323c;
    --slip:#ff5a6e; --slip-soft:#3a1c22; --focus:#8fb0ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14161b; --surface:#1d2027; --ink:#eceef3; --muted:#a2a7b5; --line:#2e323c;
  --slip:#ff5a6e; --slip-soft:#3a1c22; --focus:#8fb0ff; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:0 20px 64px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}

/* masthead: the lotto slip edge */
.mast{border-bottom:2px solid var(--slip);padding:28px 0 0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.brand{font-family:"Black Han Sans","Gothic A1",sans-serif;font-size:22px;color:var(--slip);letter-spacing:.01em;margin:0 0 10px}
nav.tabs{display:flex;gap:4px}
nav.tabs a{display:block;padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:700;font-size:15px;border:2px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;margin-bottom:-2px}
nav.tabs a[aria-current="page"]{color:var(--slip);border-color:var(--slip);background:var(--bg)}

section[hidden]{display:none}
h2{font-size:20px;margin:36px 0 6px;font-weight:800}
.lede{color:var(--muted);margin:0 0 18px;font-size:15px}

/* balls */
.balls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ball{--s:42px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;font-weight:800;color:var(--ballink);font-size:calc(var(--s)*.4);text-shadow:0 1px 1px rgba(0,0,0,.25);flex:none;font-variant-numeric:tabular-nums;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),rgba(255,255,255,0) 42%),var(--c)}
.c1{--c:var(--b1)}.c2{--c:var(--b2)}.c3{--c:var(--b3)}.c4{--c:var(--b4)}.c5{--c:var(--b5)}
.plus{color:var(--muted);font-weight:800;margin:0 2px}
.ball.sm{--s:30px}

/* hero */
.hero{padding:40px 0 8px}
.round-no{font-family:"Black Han Sans","Gothic A1",sans-serif;font-size:clamp(56px,13vw,104px);line-height:.95;color:var(--slip);margin:0}
.round-no small{font-size:.38em;color:var(--ink);margin-left:6px}
.drawdate{color:var(--muted);margin:10px 0 26px;font-size:15px}
.hero .balls{gap:12px}
.hero .ball{--s:clamp(46px,11vw,64px)}
.hero .ball{animation:drop .5s cubic-bezier(.3,1.4,.5,1) both}
.hero .ball:nth-child(2){animation-delay:.07s}.hero .ball:nth-child(3){animation-delay:.14s}
.hero .ball:nth-child(4){animation-delay:.21s}.hero .ball:nth-child(5){animation-delay:.28s}.hero .ball:nth-child(6){animation-delay:.35s}
@keyframes drop{from{transform:translateY(-24px) scale(.7);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.hero .ball{animation:none}}
.hero-meta{margin:18px 0 0;color:var(--muted);font-size:14px}
.actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.btn{border:none;background:var(--slip);color:#fff;font-weight:800;padding:12px 22px;border-radius:999px;cursor:pointer;font-size:16px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

/* methods */
.methods{border-top:1px solid var(--line);margin-top:8px}
.method{display:grid;grid-template-columns:1fr auto;gap:8px 20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.method h3{margin:0;font-size:16px;font-weight:800}
.method p{margin:2px 0 0;color:var(--muted);font-size:14px}
.method .why{grid-column:1/-1;font-size:13px;color:var(--muted);margin:0}
.method.main h3::after{content:"대표 번호";font-size:12px;font-weight:700;color:var(--slip);background:var(--slip-soft);padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:2px}
@media (max-width:640px){.method{grid-template-columns:1fr}}
.note{margin-top:28px;padding:14px 16px;background:var(--surface);border-radius:10px;font-size:14px;color:var(--muted)}

/* rounds */
.picker{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 20px}
.picker input{width:110px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-weight:700}
.iconbtn{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:700}
.iconbtn:disabled{opacity:.4;cursor:default}
.shown{padding:22px;border:2px solid var(--slip);border-radius:14px}
.shown .t{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.shown .t b{font-family:"Black Han Sans","Gothic A1",sans-serif;font-size:34px;font-weight:400;color:var(--slip);line-height:1}
.shown .t span{color:var(--muted)}
.shown .ball{--s:48px}
.list{margin-top:24px;border-top:1px solid var(--line)}
.row{display:flex;gap:16px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left}
.row:hover{background:var(--surface)}
.row .r{width:64px;font-weight:800;flex:none}
.row .d{width:96px;color:var(--muted);font-size:14px;flex:none}
@media (max-width:560px){.row .d{display:none}}
.more{margin-top:14px}
.addbox{margin-top:36px;padding:18px;background:var(--surface);border-radius:12px}
.addbox h3{margin:0 0 4px;font-size:16px}
.addbox p{margin:0 0 12px;font-size:14px;color:var(--muted)}
.addgrid{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.addgrid input{width:52px;padding:9px 6px;text-align:center;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-weight:700}
.msg{font-size:14px;margin-top:10px;min-height:1.4em}
.msg.err{color:var(--slip)}

/* stats */
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:3px;margin-bottom:16px}
.seg button{border:none;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:620px;font-variant-numeric:tabular-nums;font-size:15px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{position:sticky;top:0;background:var(--surface);font-size:13px;color:var(--muted);font-weight:700}
thead th button{all:unset;cursor:pointer}
thead th button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
th[aria-sort="descending"] button::after{content:" ▼";font-size:10px}
th[aria-sort="ascending"] button::after{content:" ▲";font-size:10px}
tbody tr:last-child td{border-bottom:none}
td.bar{min-width:150px}
.barcell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.barcell i{display:block;height:8px;border-radius:4px;background:var(--slip);opacity:.75}
.foot{margin-top:40px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <p class="brand">로또 6/45 번호 분석기</p>
    <nav class="tabs" aria-label="화면">
      <a href="#predict" data-view="predict">예상 번호</a>
      <a href="#rounds" data-view="rounds">회차별 번호</a>
      <a href="#stats" data-view="stats">번호별 통계</a>
    </nav>
  </header>

  <section id="v-predict">
    <div class="hero">
      <p class="round-no"><span id="nextNo"></span><small>회 예상 번호</small></p>
      <p class="drawdate" id="nextDate"></p>
      <div class="balls" id="heroBalls" aria-live="polite"></div>
      <p class="hero-meta" id="heroMeta"></p>
      <div class="actions">
        <button class="btn" id="regen">다시 뽑기</button>
      </div>
    </div>

    <h2>분석 방식별 번호</h2>
    <p class="lede" id="basis"></p>
    <div class="methods" id="methods"></div>
    <p class="note">로또는 매 회차 독립적으로 추첨돼서, 어떤 조합이든 1등 확률은 똑같이 8,145,060분의 1이에요. 과거 통계는 번호를 고르는 재미로만 즐겨주세요.</p>
  </section>

  <section id="v-rounds" hidden>
    <h2>회차별 당첨번호</h2>
    <p class="lede">회차를 입력하거나 목록에서 고르세요.</p>
    <div class="picker">
      <button class="iconbtn" id="prevR" aria-label="이전 회차">◀ 이전</button>
      <input id="roundInput" type="number" inputmode="numeric" min="1" aria-label="회차 번호">
      <button class="iconbtn" id="goR">보기</button>
      <button class="iconbtn" id="nextR" aria-label="다음 회차">다음 ▶</button>
    </div>
    <div class="shown" id="shown"></div>
    <div class="list" id="list"></div>
    <button class="iconbtn more" id="moreBtn">20개 더 보기</button>

    <div class="addbox">
      <h3>새 회차 추가</h3>
      <p id="addHint"></p>
      <div class="addgrid" id="addgrid"></div>
      <div class="actions" style="margin-top:12px">
        <button class="btn" id="addBtn">추가하기</button>
        <button class="btn ghost" id="resetBtn" hidden>직접 추가한 회차 지우기</button>
      </div>
      <p class="msg" id="addMsg" role="status"></p>
    </div>
  </section>

  <section id="v-stats" hidden>
    <h2>번호별 출현 횟수</h2>
    <p class="lede" id="statsLede"></p>
    <div class="seg" role="group" aria-label="집계 기간">
      <button data-range="all" aria-pressed="true">전체</button>
      <button data-range="100" aria-pressed="false">최근 100회</button>
      <button data-range="50" aria-pressed="false">최근 50회</button>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th data-k="n" aria-sort="ascending"><button>번호</button></th>
          <th data-k="main"><button>당첨번호</button></th>
          <th data-k="bonus"><button>보너스</button></th>
          <th data-k="total"><button>합계</button></th>
          <th data-k="rate"><button>출현율</button></th>
          <th data-k="last"><button>마지막 출현</button></th>
          <th data-k="gap"><button>미출현</button></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p class="foot">출현율은 당첨번호 6개 기준으로, 해당 기간 회차 중 그 번호가 당첨번호에 포함된 비율이에요. 이론상 기대값은 13.3%입니다.</p>
  </section>

  <p class="foot" id="source"></p>
</div>

  all.forEach(o=>{F[o.n]=o.main;G[o.n]=o.gap;});
  rec.forEach(o=>{R[o.n]=o.main;});
  const wF=zWeights(F,1.2), wR=zWeights(R,1.0), wG=zWeights(G.map(g=>Math.log(1+g)),1.2);
  const wB=[0];for(let i=1;i<=45;i++)wB.push(Math.sqrt(wF[i]*wR[i])+0.6*wG[i]);
  const uni=[0];for(let i=1;i<=45;i++)uni.push(1);
  const avg=(set,arr)=>Math.round(set.reduce((a,x)=>a+arr[x],0)/6*10)/10;
  const out={
    balanced:draw(wB,true), freq:draw(wF,false), recent:draw(wR,false), cold:draw(wG,false), random:weightedPick(uni)
  };
  const m=a=>Math.round(a.slice(1).reduce((x,y)=>x+y,0)/45*10)/10;
  out.why={
    balanced:set=>`홀짝 ${set.filter(x=>x%2).length}:${set.filter(x=>!(x%2)).length}, 저번호(1~22) ${set.filter(x=>x<=22).length}개, 합계 ${set.reduce((a,b)=>a+b,0)}`,
    freq:set=>`고른 번호의 평균 누적 출현 ${avg(set,F)}회 (전체 평균 ${m(F)}회)`,
    recent:set=>`고른 번호의 최근 50회 평균 출현 ${avg(set,R)}회 (전체 평균 ${m(R)}회)`,
    cold:set=>`고른 번호의 평균 미출현 ${avg(set,G)}회째 (전체 평균 ${m(G)}회)`,
    random:()=>`비교용으로 통계를 쓰지 않고 뽑은 번호`
  };
  return out;
}
const METHODS=[
  {k:"balanced",t:"균형 분석",d:"누적·최근 출현과 미출현 기간을 함께 반영하고, 홀짝·고저·합계가 치우치지 않은 조합만 남겨요.",main:true},
  {k:"freq",t:"많이 나온 번호",d:"1회부터 지금까지 당첨번호로 자주 나온 번호일수록 뽑힐 가능성을 높였어요."},
  {k:"recent",t:"최근 흐름",d:"최근 50회 동안 자주 나온 번호에 가중치를 줬어요."},
  {k:"cold",t:"오래 안 나온 번호",d:"마지막으로 나온 뒤 오래 쉬고 있는 번호일수록 가중치를 줬어요."},
  {k:"random",t:"완전 무작위",d:"모든 번호를 같은 확률로 뽑아요."}
];
function renderPredict(){
  const next=draws.length+1;
  $("nextNo").textContent=next;
  $("nextDate").textContent=fmtLong(dateOf(next));
  const g=generate();
  $("heroBalls").innerHTML=g.balanced.map(n=>ball(n)).join("");
  $("heroMeta").textContent="균형 분석 · "+g.why.balanced(g.balanced);
  $("methods").innerHTML=METHODS.map(m=>`<div class="method${m.main?" main":""}">
    <div><h3>${m.t}</h3><p>${m.d}</p></div>
    <div class="balls">${g[m.k].map(n=>ball(n,true)).join("")}</div>
    <p class="why">${g.why[m.k](g[m.k])}</p></div>`).join("");
  $("basis").textContent=`1회부터 ${draws.length}회까지 ${draws.length.toLocaleString()}개 회차를 분석했어요. 지난 당첨 조합과 똑같은 번호는 제외해요.`;
}
$("regen").addEventListener("click",renderPredict);

/* ---------- rounds ---------- */
let cur=null,listN=20;
function showRound(r){
  r=Math.max(1,Math.min(draws.length,r|0));cur=r;
  const d=draws[r-1];
  $("roundInput").value=r;$("roundInput").max=draws.length;
  $("prevR").disabled=r<=1;$("nextR").disabled=r>=draws.length;
  $("shown").innerHTML=`<div class="t"><b>${r}회</b><span>${fmt(dateOf(r))} 추첨${d.user?" · 직접 추가":""}</span></div>
    <div class="balls">${ballsHTML(d.n,d.b)}</div>`;
}
function renderList(){
  const L=draws.length,arr=[];
  for(let r=L;r>Math.max(0,L-listN);r--){const d=draws[r-1];
    arr.push(`<button class="row" data-r="${r}"><span class="r">${r}회</span><span class="d">${fmt(dateOf(r))}</span><span class="balls">${ballsHTML(d.n,d.b,true)}</span></button>`);}
  $("list").innerHTML=arr.join("");
  $("moreBtn").hidden=listN>=L;
}
$("list").addEventListener("click",e=>{const b=e.target.closest(".row");if(b){showRound(+b.dataset.r);$("shown").scrollIntoView({behavior:"smooth",block:"center"});}});
$("moreBtn").addEventListener("click",()=>{listN+=20;renderList();});
$("prevR").addEventListener("click",()=>showRound(cur-1));
$("nextR").addEventListener("click",()=>showRound(cur+1));
$("goR").addEventListener("click",()=>showRound(+$("roundInput").value));
$("roundInput").addEventListener("keydown",e=>{if(e.key==="Enter")showRound(+$("roundInput").value);});

/* add round */
function renderAdd(){
  const next=draws.length+1;
  $("addHint").textContent=`${next}회(${fmt(dateOf(next))}) 추첨 결과가 나오면 당첨번호 6개와 보너스 번호를 입력하세요. 이 브라우저에 저장되고 모든 분석에 바로 반영돼요.`;
  $("addgrid").innerHTML=[0,1,2,3,4,5].map(i=>`<input type="number" min="1" max="45" inputmode="numeric" aria-label="당첨번호 ${i+1}">`).join("")+`<span class="plus">+</span><input type="number" min="1" max="45" inputmode="numeric" aria-label="보너스 번호">`;
  $("resetBtn").hidden=!extra.length;
}
$("addBtn").addEventListener("click",()=>{
  const v=[...$("addgrid").querySelectorAll("input")].map(i=>+i.value);
  const msg=$("addMsg");msg.className="msg err";
  if(v.some(x=>!Number.isInteger(x)||x<1||x>45)){msg.textContent="1부터 45 사이 숫자 7개를 모두 입력하세요.";return;}
  if(new Set(v).size!==7){msg.textContent="같은 번호가 두 번 들어갔어요. 7개 번호는 모두 달라야 해요.";return;}
  const r=draws.length+1;
  extra.push({r,n:v.slice(0,6),b:v[6]});
  try{localStorage.setItem(STORE,JSON.stringify(extra));}catch(e){}
  rebuild();msg.className="msg";msg.textContent=`${r}회 당첨번호를 추가했어요.`;
  refreshAll();showRound(r);
});
$("resetBtn").addEventListener("click",()=>{
  extra=[];try{localStorage.removeItem(STORE);}catch(e){}
  rebuild();$("addMsg").className="msg";$("addMsg").textContent="직접 추가한 회차를 지웠어요.";
  refreshAll();showRound(draws.length);
});

/* ---------- stats table ---------- */
let range="all",sortK="n",sortDir=1;
function renderStats(){
  const {rows,count}=stats(range==="all"?"all":+range);
  const max=Math.max(...rows.map(o=>o.total));
  rows.sort((a,b)=>(a[sortK]-b[sortK])*sortDir||a.n-b.n);
  $("tbody").innerHTML=rows.map(o=>`<tr>
    <td>${ball(o.n,true)}</td><td>${o.main}</td><td>${o.bonus}</td>
    <td class="bar"><div class="barcell"><i style="width:${Math.round(o.total/max*80)}px"></i><b>${o.total}</b></div></td>
    <td>${(o.rate*100).toFixed(1)}%</td><td>${o.last}회</td><td>${o.gap===0?"직전 회차":o.gap+"회째"}</td></tr>`).join("");
  $("statsLede").textContent=(range==="all"?`1회부터 ${draws.length}회까지 `:`최근 ${count}회(${draws.length-count+1}~${draws.length}회) `)+"각 번호가 당첨번호와 보너스 번호로 나온 횟수예요. 열 제목을 누르면 정렬돼요.";
  document.querySelectorAll("thead th").forEach(th=>{th.setAttribute("aria-sort",th.dataset.k===sortK?(sortDir>0?"ascending":"descending"):"none");});
}
document.querySelector("thead").addEventListener("click",e=>{
  const th=e.target.closest("th");if(!th)return;
  const k=th.dataset.k;
  if(k===sortK)sortDir=-sortDir;else{sortK=k;sortDir=k==="n"?1:-1;}
  renderStats();
});
document.querySelector(".seg").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;range=b.dataset.range;
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  renderStats();
});

/* ---------- views ---------- */
const VIEWS=["predict","rounds","stats"];
function route(){
  const v=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):"predict";
  VIEWS.forEach(x=>{$("v-"+x).hidden=x!==v;});
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.view===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
}
window.addEventListener("hashchange",route);

function refreshAll(){
  renderPredict();renderList();renderAdd();renderStats();
  $("source").textContent=`데이터: 동행복권 공식 당첨번호 1~${BASE_LAST}회 (${fmt(dateOf(BASE_LAST))} 추첨까지)`+(extra.length?`, 직접 추가 ${extra.length}개 회차`:"")+".";
}
refreshAll();showRound(draws.length);route();
})();
</script>
</body>
